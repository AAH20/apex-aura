[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-aura"
version = "1.0.0"
description = "APEX_AURA: Sovereign Cognitive Fabric & High-Velocity AI Hypervisor"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "APEX Sovereign Systems"}
]
keywords = [
    "ai-agents",
    "sovereign-ai",
    "nvidia-nim",
    "ibm-granite",
    "watsonx",
    "openshift",
    "6g-urllc",
    "bluefield-3",
    "doca",
    "computer-use",
    "hypervisor",
    "low-latency",
    "shared-memory",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/AAH20/apex-aura"
