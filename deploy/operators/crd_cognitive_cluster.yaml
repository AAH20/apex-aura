apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cognitiveclusters.apex.org
spec:
  group: apex.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                shmCapacityMB:
                  type: integer
                nimEndpoint:
                  type: string
                watsonxTenant:
                  type: string
  scope: Namespaced
  names:
    plural: cognitiveclusters
    singular: cognitivecluster
    kind: CognitiveCluster
    shortNames:
      - cc
