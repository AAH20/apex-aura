apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-aura-kernel
  labels:
    app: apex-aura-kernel
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: apex-aura-kernel
  template:
    metadata:
      labels:
        app: apex-aura-kernel
    spec:
      containers:
        - name: aura-kernel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
